<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Post-it Notes</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="app-container">
        <h1>My Post-it Notes</h1>

        <div class="note-input-area">
            <textarea id="note-text-input" placeholder="Enter your note here..."></textarea>
            <button id="add-note-button">Add Note</button>
        </div>

        <div id="notes-container" class="notes-container">
            <!-- Notes will be dynamically loaded here by JavaScript -->
        </div>
    </div>

    <script src="src/js/script.js"></script>
</body>
</html>
